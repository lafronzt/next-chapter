name: Publish container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Never cancel a release midway; a second run for the same tag waits.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
# Third-party actions are pinned by commit SHA; the comment is the release.
jobs:
  # Everything that can fail runs here, without registry access: tests, the
  # amd64 image, its smoke test and version check, and a vulnerability scan.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Release version from the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: next-chapter:release
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same script as CI; also checks that the binary reports the tag.
      - name: Smoke test and version check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/smoke.sh next-chapter:release "$VERSION"
      # The image is FROM scratch, so findings come from the Go module and
      # standard-library versions recorded in the binary.
      - name: Scan for fixable high and critical vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: next-chapter:release
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # The only job that can write packages. It rebuilds from the layer cache the
  # verify job filled, adds arm64, and pushes with provenance and an SBOM.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            # Pre-releases (v1.2.3-rc1) must not move latest.
            type=raw,value=latest,enable=${{ !contains(needs.verify.outputs.version, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          provenance: true
          sbom: true

  # Runs on the self-hosted runner, which can reach the cluster API server, so
  # the cluster is never exposed to GitHub-hosted runners. The kubeconfig is
  # the KUBE_CONFIG secret on the production environment (a namespaced service
  # account; see deploy/kubernetes/runner-rbac.yaml). Release candidates are
  # published but not deployed.
  deploy:
    needs: [verify, publish]
    if: ${{ !contains(needs.verify.outputs.version, '-') }}
    # The ARC runner advertises only the default labels (self-hosted, Linux,
    # X64), so select it by self-hosted.
    runs-on: self-hosted
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ARC runner images do not ship helm, and the pods are ephemeral, so
      # install a pinned release on every run. The checksums come from
      # https://get.helm.sh/helm-<version>-linux-<arch>.tar.gz.sha256sum; update
      # them with the version. The binary goes in RUNNER_TEMP: no root needed.
      - name: Install helm
        env:
          HELM_VERSION: v4.3.1
          HELM_SHA256_AMD64: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          HELM_SHA256_ARM64: 8cf8f66ecbc252ac8f7f06cca68aba88508ddfde3a6a34feb1678ad1694b4f88
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=$HELM_SHA256_AMD64 ;;
            aarch64 | arm64) arch=arm64; sha=$HELM_SHA256_ARM64 ;;
            *) echo "::error::Unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          tarball="helm-${HELM_VERSION}-linux-${arch}.tar.gz"
          mkdir -p "$RUNNER_TEMP/helm"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://get.helm.sh/$tarball"
          echo "$sha  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/helm" --strip-components=1 "linux-${arch}/helm"
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
      - name: Write the kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      # --reuse-values keeps the password, ingress host and AI settings from
      # the first install; only the image tag changes. --rollback-on-failure rolls the
      # release back if the new pod never becomes ready. A rollback does not
      # undo a SQLite migration: back up the data volume first (see README).
      - name: Upgrade the Helm release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm upgrade --install next-chapter deploy/helm/next-chapter \
            --namespace next-chapter \
            --reuse-values \
            --set image.tag="$VERSION" \
            --rollback-on-failure --timeout 5m
      - name: Show the release
        run: helm status next-chapter --namespace next-chapter
      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

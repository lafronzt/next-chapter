name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker build -t next-chapter:test .
      - name: Container smoke test
        shell: bash
        run: |
          docker run -d --name next-chapter-test -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp -e APP_PASSWORD="$(openssl rand -hex 24)" -e APP_SECRET_KEY="$(openssl rand -hex 32)" next-chapter:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs next-chapter-test
          exit 1
      - if: always()
        run: docker rm -fv next-chapter-test || true

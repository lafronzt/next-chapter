{{template "top" .}}
<header class="page-heading">
  <div>
    <div class="eyebrow">WELCOME BACK</div>
    <h1>A quiet place for your books.</h1>
    <p>Sign in to your personal reading room.</p>
  </div>
</header>
{{if .LoginError}}<div class="notice error">{{.LoginError}}</div>{{end}}
<form class="panel stack login" method="post">
  {{template "fields" .}}
  <label>Your app password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button class="button primary">Open my library →</button>
</form>
{{template "bottom" .}}

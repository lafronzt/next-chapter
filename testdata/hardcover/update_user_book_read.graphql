mutation UpdateUserBookRead($id: Int!, $read: DatesReadInput!) {
  update_user_book_read(id: $id, object: $read) {
    id
    error
    user_book_read { id started_at finished_at finished_at_precision progress_pages progress_seconds }
  }
}
# read: { progress_pages | progress_seconds, action_at } for progress, or
# { started_at, finished_at, finished_at_precision } for a date. Only sent fields change.

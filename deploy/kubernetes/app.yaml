apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: next-chapter-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-chapter
spec:
  replicas: 1
  # SQLite + one poller: do not overlap replicas or scale horizontally.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: next-chapter
  template:
    metadata:
      labels:
        app: next-chapter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Pin a release tag or digest before deploying.
          image: ghcr.io/lafronzt/next-chapter:0.2.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: next-chapter-auth
          env:
            - name: DATABASE_PATH
              value: /data/next-chapter.sqlite3
            # Set 1 for HTTPS ingress. 0 supports localhost port-forward testing.
            - name: COOKIE_SECURE
              value: "0"
            # Set 1 behind an Ingress controller so login limits apply per visitor.
            - name: TRUSTED_PROXY_HOPS
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: next-chapter-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: next-chapter
spec:
  selector:
    app: next-chapter
  ports:
    - port: 80
      targetPort: http

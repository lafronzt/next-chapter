{{- if not .Values.auth.existingSecret }}
{{- $name := include "nc.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.auth.secretKey }}
{{- if not $key }}{{ if $existing }}{{ $key = index $existing.data "APP_SECRET_KEY" | b64dec }}{{ else }}{{ $key = randAlphaNum 48 }}{{ end }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "nc.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_PASSWORD: {{ required "auth.password (or auth.existingSecret) is required" .Values.auth.password | quote }}
  APP_SECRET_KEY: {{ $key | quote }}
  {{- if .Values.ai.apiKey }}
  AI_API_KEY: {{ .Values.ai.apiKey | quote }}
  {{- end }}
{{- end }}
